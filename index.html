    /* ---- ficha del empleado ---- */
    function openFicha(id) {
      const e = empById(id); if (!e) return;
      const body = el("div");
      body.appendChild(el("div", { class: "ficha-top" }, [
        avatar(e.nombre),
        el("div", null, [el("b", { text: e.nombre }), el("small", { text: (e.puesto || "—") + " · " + (e.departamento || "—") })])
      ]));
      body.appendChild(el("div", { style: "margin-bottom:16px" }, [estadoPill(e.estado),
      el("span", { class: "pill plain", text: e.tipoContrato || "—", style: "margin-left:6px" })]));

      const dl = el("dl", { class: "dl" });
      const add = (k, v) => dl.appendChild(el("div", null, [el("dt", { text: k }), el("dd", { text: v || "—" })]));
      add("DPI", e.dpi);
      add("Fecha de ingreso", fmtDate(e.fechaIngreso));
      add("Antigüedad", yearsBetween(e.fechaIngreso) + " año(s)");
      add("Salario base", money(e.salario));
      add("Teléfono", e.telefono);
      add("Correo", e.correo);
      add("Nacimiento", fmtDate(e.fechaNacimiento));
      add("Emergencia", e.emergenciaNombre ? (e.emergenciaNombre + " · " + (e.emergenciaTel || "")) : "");
      body.appendChild(dl);
      if (e.direccion) body.appendChild(el("p", { class: "sub", style: "margin:-6px 0 16px", text: "Dirección: " + e.direccion }));
      if (e.notas) body.appendChild(el("p", { class: "sub", style: "margin:-6px 0 16px;color:var(--ink)", text: e.notas }));

      // prestaciones estimadas
      const anios = yearsBetween(e.fechaIngreso);
      const sal = Number(e.salario) || 0;
      const mesesAnio = Math.max(1, Math.min(12, monthsBetween(e.fechaIngreso)));
      const bono14 = sal * mesesAnio / 12;
      const aguinaldo = sal * mesesAnio / 12;
      const vacDias = anios >= 1 ? 15 : 0;
      const tomadas = state.ausencias.filter(a => a.empleadoId === id && a.tipo === "Vacaciones" && a.estado === "Aprobada").reduce((s, a) => s + (Number(a.dias) || 0), 0);
      const indem = sal * anios;
      body.appendChild(el("div", { class: "sect-title", text: "Estimación de prestaciones" }));
      const prest = el("div", { class: "prest" });
      const pbox = (k, v) => prest.appendChild(el("div", { class: "pbox" }, [el("div", { class: "k", text: k }), el("div", { class: "v", text: v })]));
      pbox("Bono 14 (proyect.)", money(bono14));
      pbox("Aguinaldo (proyect.)", money(aguinaldo));
      pbox("Vacaciones al año", vacDias + " días");
      pbox("Vacaciones tomadas", tomadas + " días");
      pbox("Indemnización aprox.", money(indem));
      pbox("Años completos", anios + "");
      prest.appendChild(el("div", { class: "prest-note", text: "Cálculos aproximados según prestaciones de ley en Guatemala (Bono 14, aguinaldo, 15 días de vacaciones por año, indemnización = 1 salario por año). Verifica con tu contador antes de pagar." }));
      body.appendChild(prest);

      // ausencias del empleado
      body.appendChild(el("div", { class: "sect-title" }, ["Ausencias", el("button", { class: "btn sm ghost", text: "+ Agregar", onclick: () => openAusForm() })]));
      const aus = state.ausencias.filter(a => a.empleadoId === id).sort((a, b) => (b.inicio || "").localeCompare(a.inicio || ""));
      if (!aus.length) body.appendChild(el("div", { class: "empty-mini", text: "Sin ausencias registradas." }));
      else {
        const list = el("div", { class: "mini-list" });
        aus.forEach(a => list.appendChild(el("div", { class: "mini-item" }, [
          el("div", { class: "mi-head" }, [el("b", { text: a.tipo }), ausPill(a.estado)]),
          el("div", { class: "mi-date", text: fmtDate(a.inicio) + " → " + fmtDate(a.fin) + "  ·  " + (a.dias || "?") + " día(s)" }),
          a.motivo ? el("p", { text: a.motivo }) : null
        ])));
        body.appendChild(list);
      }

      // historial del empleado
      body.appendChild(el("div", { class: "sect-title" }, ["Historial", el("button", { class: "btn sm ghost", text: "+ Agregar", onclick: () => openRegForm(null, id) })]));
      const regs = state.registros.filter(r => r.empleadoId === id).sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));
      if (!regs.length) body.appendChild(el("div", { class: "empty-mini", text: "Sin registros en el historial." }));
      else {
        const list = el("div", { class: "mini-list" });
        regs.forEach(r => list.appendChild(el("div", { class: "mini-item" }, [
          el("div", { class: "mi-head" }, [el("b", { text: r.tipo }), el("span", { class: "mi-date", text: fmtDate(r.fecha) })]),
          r.descripcion ? el("p", { text: r.descripcion }) : null
        ])));
        body.appendChild(list);
      }

      const foot = el("div", null, [
        el("button", { class: "btn danger", text: "Eliminar", onclick: () => confirmDelete(`¿Eliminar a ${e.nombre} y todos sus registros?`, () => deleteEmpleado(id)) }),
        el("button", { class: "btn ghost", text: "Cerrar", onclick: closeDrawer }),
        el("button", { class: "btn", text: "Editar", onclick: () => openEmpForm(id) })
      ]);
      openDrawer(e.nombre, "Ficha del empleado", body, foot);
    }

    /* ============ tema ============ */
    function applyTheme(t) {
      if (t === "system") document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", t);
      try { localStorage.setItem("rrhh_theme", t); } catch (e) { }
      const lbl = { light: "Claro", dark: "Oscuro", system: "Automático" };
      const n = $("#themeLbl"); if (n) n.textContent = lbl[t];
    }
    function initTheme() {
      // Arranca en oscuro, como el sitio de ProgramasGT. Quien prefiera
      // claro lo tiene a un clic y la eleccion se recuerda.
      let t = "dark";
      try { t = localStorage.getItem("rrhh_theme") || "dark"; } catch (e) { }
      applyTheme(t);
      $("#themeBtn").addEventListener("click", () => {
        let cur = "dark";
        try { cur = localStorage.getItem("rrhh_theme") || "dark"; } catch (e) { }
        applyTheme({ dark: "light", light: "system", system: "dark" }[cur] || "dark");
      });
    }

    /* ============ arranque ============ */
    function boot() {
      initTheme();
      $("#nav").addEventListener("click", ev => {
        const b = ev.target.closest("button[data-view]"); if (!b) return;
        view = b.dataset.view; render();
      });
      $("#scrim").addEventListener("click", closeDrawer);
      document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeDrawer(); });

      $("#exportBtn").addEventListener("click", exportData);
      $("#importBtn").addEventListener("click", () => $("#importFile").click());
      $("#importFile").addEventListener("change", ev => {
        const f = ev.target.files && ev.target.files[0];
        if (f && confirm("Importar reemplazará todos los datos actuales de este navegador. ¿Continuar?")) importData(f);
        ev.target.value = "";
      });

      const hadLocal = loadLocal();
      if (!hadLocal) loadSamples();
      render();
    }
    boot();
  </script>
  <!-- ==========================================================
       PIEL PROGRAMASGT — comportamiento
       Lluvia de datos, logotipo que cae, inclinacion 3D, contadores
       y foco del cajon lateral. Cero dependencias obligatorias: si
       Vanilla-Tilt no carga, todo lo demas sigue funcionando.
       ========================================================== -->
  <script id="pgt-piel-js">
    (function () {
      "use strict";

      var mqMenos = window.matchMedia("(prefers-reduced-motion: reduce)");
      var mqFino = window.matchMedia("(hover:hover) and (pointer:fine)");

      /* ============ 1. Lluvia de datos ============
         Azul, no verde: el verde es el Matrix de todo el mundo. En el
         azul de la marca se lee como consola de sistema, que es lo que
         vende este producto.

         Se pausa con la pestana oculta y tiene techo de 22 fps: a 120 Hz
         el efecto no se ve mejor y cuesta cuatro veces mas. */
      (function lluvia() {
        var barra = document.querySelector(".pgt-top");
        var lienzo = document.querySelector(".pgt-lluvia");
        if (!barra || !lienzo) return;

        var ctx = lienzo.getContext("2d");
        if (!ctx) { lienzo.remove(); return; }

        var GLIFOS = "0123456789ABCDEF<>/\\[]{}=+*".split("");
        var CELDA = 16;
        var ESTELA = 7;
        var PASO_MS = 1000 / 22;

        var gotas = [], ancho = 0, alto = 0, cols = 0;
        var rafId = 0, ultimo = 0, acumulado = 0, visible = !document.hidden;

        function oscuro() {
          var t = document.documentElement.getAttribute("data-theme");
          if (t === "dark") return true;
          if (t === "light") return false;
          return window.matchMedia("(prefers-color-scheme: dark)").matches;
        }

        function medir() {
          var caja = barra.getBoundingClientRect();
          ancho = Math.max(1, Math.round(caja.width));
          alto = Math.max(1, Math.round(caja.height));

          // Topamos el ratio: en una pantalla Retina respetarlo pintaria
          // cuatro veces mas pixeles para un efecto a media opacidad.
          var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
          lienzo.width = Math.round(ancho * dpr);
          lienzo.height = Math.round(alto * dpr);
          lienzo.style.width = ancho + "px";
          lienzo.style.height = alto + "px";

          // setTransform y no scale: scale se acumula en cada medida.
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.font = "500 12px 'JetBrains Mono', ui-monospace, monospace";
          ctx.textBaseline = "top";

          cols = Math.ceil(ancho / CELDA);
          var cuantas = Math.max(6, Math.round(cols * 0.40));
          gotas = new Array(cuantas);
          for (var i = 0; i < cuantas; i++) gotas[i] = nueva(true);
        }

        function nueva(inicial) {
          return {
            col: (Math.random() * cols) | 0,
            y: inicial ? Math.random() * alto : -ESTELA * CELDA,
            v: 0.5 + Math.random() * 1.3,
            glifos: sembrar()
          };
        }

        function sembrar() {
          var a = new Array(ESTELA);
          for (var i = 0; i < ESTELA; i++) a[i] = GLIFOS[(Math.random() * GLIFOS.length) | 0];
          return a;
        }

        function dibujar() {
          ctx.clearRect(0, 0, ancho, alto);
          var claro = oscuro() ? "#9CC9FF" : "#0B63C4";
          var cuerpo = oscuro() ? "#4FA3FF" : "#0B63C4";

          for (var i = 0; i < gotas.length; i++) {
            var g = gotas[i];
            var x = g.col * CELDA;

            for (var j = 0; j < ESTELA; j++) {
              var y = g.y - j * CELDA;
              if (y < -CELDA || y > alto) continue;
              // La estela se apaga hacia arriba; la cabeza va mas clara.
              ctx.globalAlpha = Math.pow(1 - j / ESTELA, 1.7);
              ctx.fillStyle = j === 0 ? claro : cuerpo;
              ctx.fillText(g.glifos[j], x, y);
            }

            g.y += g.v * 6;

            // Cambiar un glifo de vez en cuando: cambiarlos todos en cada
            // fotograma se ve como parpadeo, no como datos.
            if (Math.random() < .3) {
              g.glifos[(Math.random() * ESTELA) | 0] = GLIFOS[(Math.random() * GLIFOS.length) | 0];
            }

            if (g.y - ESTELA * CELDA > alto) gotas[i] = nueva(false);
          }
          ctx.globalAlpha = 1;
        }

        function bucle(ahora) {
          rafId = requestAnimationFrame(bucle);
          if (!ultimo) { ultimo = ahora; return; }
          var delta = ahora - ultimo;
          ultimo = ahora;
          // Al volver de una pestana oculta el delta trae cientos de ms:
          // sin tope habria un salto o una rafaga de recuperacion.
          if (delta > 250) delta = PASO_MS;
          acumulado += delta;
          if (acumulado < PASO_MS) return;
          acumulado %= PASO_MS;
          dibujar();
        }

        function sincronizar() {
          var debe = visible && !mqMenos.matches;
          if (debe && !rafId) {
            ultimo = 0; acumulado = 0;
            rafId = requestAnimationFrame(bucle);
          } else if (!debe && rafId) {
            cancelAnimationFrame(rafId);
            rafId = 0;
            ctx.clearRect(0, 0, ancho, alto);
          }
        }

        document.addEventListener("visibilitychange", function () {
          visible = !document.hidden;
          sincronizar();
        });

        // En movil, mostrar u ocultar la barra de direcciones dispara
        // resize cambiando solo la altura: filtramos por ancho.
        var temp = 0, anchoPrevio = window.innerWidth;
        window.addEventListener("resize", function () {
          if (Math.abs(window.innerWidth - anchoPrevio) < 24) return;
          anchoPrevio = window.innerWidth;
          clearTimeout(temp);
          temp = setTimeout(medir, 200);
        }, { passive: true });

        if (mqMenos.addEventListener) mqMenos.addEventListener("change", sincronizar);

        medir();
        sincronizar();
      })();

      /* ============ 2. El logotipo cae letra por letra ============
         El texto real se conserva en una copia oculta para que un lector
         de pantalla lea "ProgramasGT", no "P-r-o-g-r-a-m-a-s". */
      (function logotipo() {
        var destino = document.querySelector("[data-letras]");
        if (!destino) return;

        var texto = destino.textContent.trim();
        var sr = document.createElement("span");
        sr.className = "pgt-sr";
        sr.textContent = texto;

        destino.textContent = "";
        destino.appendChild(sr);

        if (mqMenos.matches) {
          destino.appendChild(document.createTextNode(texto));
          return;
        }

        var envoltura = document.createElement("span");
        envoltura.setAttribute("aria-hidden", "true");
        texto.split("").forEach(function (ch, i) {
          var l = document.createElement("span");
          l.className = "letra";
          l.textContent = ch;
          l.style.setProperty("--d", (i * 38) + "ms");
          l.style.setProperty("--dh", (i * 26) + "ms");
          envoltura.appendChild(l);
        });
        destino.appendChild(envoltura);
      })();

      /* ============ 3. Contadores ============
         Solo se animan cuando el valor CAMBIA. Si se reanimaran en cada
         repintado, marcar una asistencia haria bailar las cuatro cifras. */
      var memoria = {};

      function animarCifra(nodo, clave) {
        var destino = nodo.textContent;
        var m = destino.match(/^(\D*?)([\d.,]+)([\s\S]*)$/);
        if (!m) return;

        var fin = parseFloat(m[2].replace(/,/g, ""));
        if (!isFinite(fin)) return;

        var decimales = /\.\d\d$/.test(m[2]) ? 2 : 0;
        var ini = memoria[clave];
        memoria[clave] = fin;

        // Primera pintura: sube desde cero. Despues, solo si el dato cambia.
        if (ini === undefined) ini = 0;
        if (ini === fin || mqMenos.matches) return;

        var t0 = 0, dur = 480;
        function formatear(v) {
          return m[1] + v.toLocaleString("es-GT", {
            minimumFractionDigits: decimales, maximumFractionDigits: decimales
          }) + m[3];
        }
        function paso(ahora) {
          if (!t0) t0 = ahora;
          var p = Math.min(1, (ahora - t0) / dur);
          // Desaceleracion: la cifra llega, no frena de golpe.
          var e = 1 - Math.pow(1 - p, 3);
          nodo.textContent = formatear(ini + (fin - ini) * e);
          if (p < 1) requestAnimationFrame(paso);
          else nodo.textContent = destino;
        }
        requestAnimationFrame(paso);
      }

      /* ============ 4. Inclinacion 3D y resplandor ============ */
      function seguirBrillo(el) {
        var rect = null, pendiente = false, px = 0, py = 0;
        el.addEventListener("mouseenter", function () {
          rect = el.getBoundingClientRect();
        }, { passive: true });
        el.addEventListener("mousemove", function (e) {
          if (!rect) return;
          px = e.clientX; py = e.clientY;
          if (pendiente) return;
          pendiente = true;
          requestAnimationFrame(function () {
            pendiente = false;
            if (!rect) return;
            el.style.setProperty("--mx", (((px - rect.left) / rect.width) * 100).toFixed(1) + "%");
            el.style.setProperty("--my", (((py - rect.top) / rect.height) * 100).toFixed(1) + "%");
          });
        }, { passive: true });
        el.addEventListener("mouseleave", function () { rect = null; }, { passive: true });
      }

      function inclinar(tarjetas) {
        tarjetas.forEach(function (el) {
          if (el.querySelector(".tilt-brillo")) return;
          var b = document.createElement("span");
          b.className = "tilt-brillo";
          b.setAttribute("aria-hidden", "true");
          el.insertBefore(b, el.firstChild);
        });

        if (mqMenos.matches || !mqFino.matches) return;

        tarjetas.forEach(function (el) {
          if (el.classList.contains("js-tilt")) return;
          el.classList.add("js-tilt");
          seguirBrillo(el);
          // 4 grados: es un panel de trabajo, no una tarjeta de producto.
          if (window.VanillaTilt) {
            window.VanillaTilt.init(el, {
              max: 4, speed: 420, scale: 1.008, glare: false,
              perspective: 1000, gyroscope: false
            });
          }
        });
      }

      /* ============ 5. Decorar lo recien pintado ============
         El panel vuelve a dibujar #main entero en cada cambio. Esta
         funcion la llama render() al terminar. */
      var vistaPrevia = null;

      window.pgtDecorar = function (vista) {
        var main = document.getElementById("main");
        if (!main) return;

        var tarjetas = Array.prototype.slice.call(main.querySelectorAll(".tile, .card"));
        inclinar(tarjetas);

        main.querySelectorAll(".tile").forEach(function (t) {
          var v = t.querySelector(".v"), k = t.querySelector(".k");
          if (v && k) animarCifra(v, k.textContent);
        });

        // La aparicion escalonada solo al cambiar de seccion: repetirla
        // en cada clic convertiria el panel en una feria.
        if (vista !== vistaPrevia && !mqMenos.matches) {
          vistaPrevia = vista;
          var bloques = Array.prototype.slice.call(
            main.querySelectorAll(".tile, .card, .table-wrap, .empty, .toolbar, .att-toolbar")
          );
          bloques.forEach(function (b, i) {
            b.classList.remove("pgt-entra");
            // Reinicio del flujo: sin esto el navegador reutiliza la
            // animacion anterior y no vuelve a correr.
            void b.offsetWidth;
            b.style.setProperty("--e", Math.min(i * 45, 320) + "ms");
            b.classList.add("pgt-entra");
          });
        }
      };

      /* ============ 6. Foco del cajon lateral ============
         Al abrir, el foco entra al primer campo; al cerrar, vuelve a
         donde estaba. Tab queda atrapado dentro mientras esta abierto. */
      (function cajon() {
        var cajon = document.getElementById("drawer");
        if (!cajon) return;
        var anterior = null;

        function focoables() {
          return Array.prototype.slice.call(cajon.querySelectorAll(
            'a[href], button:not([disabled]), input:not([type=hidden]), select, textarea, [tabindex]:not([tabindex="-1"])'
          )).filter(function (n) { return n.offsetParent !== null; });
        }

        new MutationObserver(function () {
          var abierto = cajon.classList.contains("open");
          if (abierto && !cajon.dataset.pgtAbierto) {
            cajon.dataset.pgtAbierto = "1";
            anterior = document.activeElement;
            setTimeout(function () {
              var campo = cajon.querySelector(".drawer-body input, .drawer-body select, .drawer-body textarea")
                || cajon.querySelector(".drawer-foot .btn");
              if (campo) campo.focus();
            }, 80);
          } else if (!abierto && cajon.dataset.pgtAbierto) {
            delete cajon.dataset.pgtAbierto;
            if (anterior && anterior.focus && document.contains(anterior)) anterior.focus();
            anterior = null;
          }
        }).observe(cajon, { attributes: true, attributeFilter: ["class"] });

        document.addEventListener("keydown", function (ev) {
          if (ev.key !== "Tab" || !cajon.classList.contains("open")) return;
          var lista = focoables();
          if (!lista.length) return;
          var primero = lista[0], ultimo = lista[lista.length - 1];
          if (ev.shiftKey && document.activeElement === primero) {
            ev.preventDefault(); ultimo.focus();
          } else if (!ev.shiftKey && document.activeElement === ultimo) {
            ev.preventDefault(); primero.focus();
          }
        });
      })();

      /* La primera pintura ocurre antes de que este script corra: el
         panel ya esta en pantalla, asi que lo decoramos una vez aqui. */
      if (window.pgtDecorar) window.pgtDecorar("panel");
      document.addEventListener("DOMContentLoaded", function () {
        window.pgtDecorar(vistaPrevia || "panel");
      });
    })();
  </script>

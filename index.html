<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de Recursos Humanos | ProgramasGT</title>
  <meta name="description"
    content="Sistema de Recursos Humanos de ProgramasGT: expedientes, planilla, asistencia, ausencias e historial del personal. Demostración en línea, lista para probar.">
  <meta name="author" content="ProgramasGT">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#04080F">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_GT">
  <meta property="og:site_name" content="ProgramasGT">
  <meta property="og:title" content="Sistema de Recursos Humanos | ProgramasGT">
  <meta property="og:description"
    content="Expedientes, planilla, asistencia, permisos y prestaciones de ley de Guatemala en un solo panel. Demostración en línea.">
  <meta property="og:image" content="https://programasgt.art/og-image.jpg">
  <link rel="icon" href="https://programasgt.art/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">

  <!-- Inclinacion 3D declarativa. Si el CDN cae, el panel funciona igual:
       queda el vidrio, el resplandor y el resto de la capa visual. -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
  <style>
    img {
      max-width: 100%
    }

    [hidden] {
      display: none !important
    }

    :root {
      color-scheme: light dark
    }

    :root {
      --ground: #F4F6F3;
      --surface: #FFFFFF;
      --surface-2: #FBFCFA;
      --ink: #1B2320;
      --muted: #5C6862;
      --faint: #8A968F;
      --line: #E1E6E1;
      --line-strong: #CFD7D0;
      --accent: #0E6E5C;
      --accent-ink: #0A5346;
      --accent-soft: #DCEAE4;
      --on-accent: #FFFFFF;
      --ok: #2F7D4F;
      --ok-soft: #E1F0E4;
      --warn: #9C6410;
      --warn-soft: #F6EAD5;
      --crit: #B23B3B;
      --crit-soft: #F5E0DE;
      --info: #35617D;
      --info-soft: #E0EAF0;
      --shadow: 0 1px 2px rgba(27, 35, 32, .06), 0 6px 20px -8px rgba(27, 35, 32, .14);
      --radius: 10px;
      --sans: "IBM Plex Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      --display: "Bricolage Grotesque", var(--sans);
      --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --ground: #121815;
        --surface: #1B231F;
        --surface-2: #202924;
        --ink: #E7EDE8;
        --muted: #9DAAA2;
        --faint: #75837B;
        --line: #2C3833;
        --line-strong: #3A4842;
        --accent: #54C1A7;
        --accent-ink: #8FD9C8;
        --accent-soft: #1E3A33;
        --on-accent: #08201B;
        --ok: #63BE86;
        --ok-soft: #1C3327;
        --warn: #D69B4E;
        --warn-soft: #3A2E1A;
        --crit: #E08079;
        --crit-soft: #3A231F;
        --info: #7FB0CC;
        --info-soft: #1D2E39;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px -10px rgba(0, 0, 0, .5);
      }
    }

    :root[data-theme="dark"] {
      --ground: #121815;
      --surface: #1B231F;
      --surface-2: #202924;
      --ink: #E7EDE8;
      --muted: #9DAAA2;
      --faint: #75837B;
      --line: #2C3833;
      --line-strong: #3A4842;
      --accent: #54C1A7;
      --accent-ink: #8FD9C8;
      --accent-soft: #1E3A33;
      --ok: #63BE86;
      --ok-soft: #1C3327;
      --warn: #D69B4E;
      --warn-soft: #3A2E1A;
      --crit: #E08079;
      --crit-soft: #3A231F;
      --info: #7FB0CC;
      --info-soft: #1D2E39;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px -10px rgba(0, 0, 0, .5);
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      padding: 0
    }

    body {
      background: var(--ground);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    h1,
    h2,
    h3 {
      font-family: var(--display);
      font-weight: 700;
      margin: 0;
      text-wrap: balance;
      letter-spacing: -.01em
    }

    button {
      font-family: inherit;
      font-size: inherit;
      cursor: pointer
    }

    input,
    select,
    textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit
    }

    a {
      color: var(--accent-ink)
    }

    .num {
      font-variant-numeric: tabular-nums
    }

    .mono {
      font-family: var(--mono)
    }

    /* ---------- shell ---------- */
    .app {
      display: grid;
      grid-template-columns: 236px 1fr;
      min-height: 100vh
    }

    .side {
      background: var(--surface);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      padding: 20px 14px;
      gap: 6px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 8px 16px
    }

    .brand .mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--accent);
      display: grid;
      place-items: center;
      color: var(--on-accent);
      font-family: var(--display);
      font-weight: 700;
      font-size: 15px;
      flex: none;
    }

    .brand b {
      font-family: var(--display);
      font-weight: 700;
      font-size: 15px;
      line-height: 1.15;
      letter-spacing: -.01em
    }

    .brand span {
      display: block;
      font-size: 11px;
      color: var(--faint);
      font-weight: 500
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 4px
    }

    .nav button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      padding: 9px 10px;
      border: 0;
      background: none;
      color: var(--muted);
      border-radius: 8px;
      font-weight: 500;
    }

    .nav button:hover {
      background: var(--surface-2);
      color: var(--ink)
    }

    .nav button.active {
      background: var(--accent-soft);
      color: var(--accent-ink);
      font-weight: 600
    }

    .nav button .ico {
      width: 18px;
      height: 18px;
      flex: none;
      opacity: .9
    }

    .nav .count {
      margin-left: auto;
      font-size: 11px;
      background: var(--ground);
      color: var(--muted);
      border-radius: 999px;
      padding: 1px 7px;
      font-variant-numeric: tabular-nums
    }

    .nav button.active .count {
      background: var(--surface);
      color: var(--accent-ink)
    }

    .side .foot {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px
    }

    .side .foot small {
      color: var(--faint);
      font-size: 11px;
      line-height: 1.4
    }

    .side .foot small b {
      color: var(--muted);
      font-weight: 600
    }

    .foot-row {
      display: flex;
      gap: 6px
    }

    .themebtn {
      flex: 1;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--muted);
      border-radius: 8px;
      padding: 7px 10px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
      font-size: 12px
    }

    .themebtn:hover {
      color: var(--ink);
      border-color: var(--line-strong)
    }

    .main {
      padding: 26px 30px 60px;
      min-width: 0;
      max-width: 1200px
    }

    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap
    }

    .page-head h1 {
      font-size: 26px
    }

    .page-head p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px
    }

    .eyebrow {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--faint);
      font-weight: 600
    }

    .btn {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: var(--on-accent);
      border-radius: 8px;
      padding: 9px 15px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--accent-ink);
      border-color: var(--accent-ink);
      color: var(--on-accent)
    }

    .btn.ghost {
      background: none;
      color: var(--muted);
      border-color: var(--line-strong)
    }

    .btn.ghost:hover {
      background: var(--surface-2);
      color: var(--ink)
    }

    .btn.sm {
      padding: 6px 11px;
      font-size: 12.5px
    }

    .btn.danger {
      background: none;
      color: var(--crit);
      border-color: var(--crit-soft)
    }

    .btn.danger:hover {
      background: var(--crit-soft)
    }

    /* ---------- sample banner ---------- */
    .banner {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--warn-soft);
      border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent);
      color: var(--warn);
      border-radius: var(--radius);
      padding: 11px 14px;
      margin-bottom: 20px;
      font-size: 13px;
      font-weight: 500;
    }

    .banner b {
      font-weight: 600
    }

    .banner button {
      margin-left: auto;
      border: 1px solid currentColor;
      color: inherit;
      background: none;
      border-radius: 7px;
      padding: 5px 10px;
      font-weight: 600;
      font-size: 12px;
      opacity: .9
    }

    .banner button:hover {
      opacity: 1
    }

    /* ---------- tiles ---------- */
    .tiles {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 24px
    }

    .tile {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .tile .k {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .09em;
      color: var(--faint);
      font-weight: 600
    }

    .tile .v {
      font-family: var(--display);
      font-weight: 700;
      font-size: 30px;
      line-height: 1;
      font-variant-numeric: tabular-nums
    }

    .tile .s {
      font-size: 12px;
      color: var(--muted)
    }

    .tile.accent {
      background: var(--accent-soft);
      border-color: transparent
    }

    .tile.accent .v {
      color: var(--accent-ink)
    }

    .tile.accent .k {
      color: var(--accent-ink);
      opacity: .8
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 16px
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px
    }

    .card h2 {
      font-size: 15px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .card h2 .tag {
      font-size: 11px;
      color: var(--faint);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .08em
    }

    /* dept bars */
    .bars {
      display: flex;
      flex-direction: column;
      gap: 11px
    }

    .bar-row {
      display: grid;
      grid-template-columns: 120px 1fr 34px;
      align-items: center;
      gap: 10px;
      font-size: 12.5px
    }

    .bar-row .lbl {
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .bar-track {
      height: 8px;
      background: var(--ground);
      border-radius: 999px;
      overflow: hidden
    }

    .bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px
    }

    .bar-row .n {
      text-align: right;
      color: var(--ink);
      font-weight: 600;
      font-variant-numeric: tabular-nums
    }

    /* alerts */
    .alerts {
      display: flex;
      flex-direction: column;
      gap: 2px
    }

    .alert {
      display: flex;
      gap: 11px;
      padding: 10px 6px;
      border-bottom: 1px solid var(--line);
      font-size: 13px
    }

    .alert:last-child {
      border-bottom: 0
    }

    .alert .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      margin-top: 5px;
      flex: none;
      background: var(--faint)
    }

    .alert.warn .dot {
      background: var(--warn)
    }

    .alert.info .dot {
      background: var(--info)
    }

    .alert.crit .dot {
      background: var(--crit)
    }

    .alert .txt b {
      font-weight: 600
    }

    .alert .txt span {
      color: var(--muted);
      display: block;
      font-size: 12px
    }

    .empty-mini {
      color: var(--faint);
      font-size: 13px;
      padding: 8px 6px
    }

    /* ---------- toolbar ---------- */
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap
    }

    .search {
      position: relative;
      flex: 1;
      min-width: 200px;
      max-width: 340px
    }

    .search input {
      width: 100%;
      padding: 9px 12px 9px 34px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface)
    }

    .search svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      opacity: .5
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .filters select {
      padding: 8px 10px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface)
    }

    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    button:focus-visible,
    .nav button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    /* ---------- table ---------- */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow-x: auto
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px
    }

    thead th {
      text-align: left;
      padding: 11px 14px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--faint);
      font-weight: 600;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
      background: var(--surface-2);
    }

    tbody td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle
    }

    tbody tr:last-child td {
      border-bottom: 0
    }

    tbody tr.clickable {
      cursor: pointer
    }

    tbody tr.clickable:hover {
      background: var(--surface-2)
    }

    .cell-name {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      flex: none;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 600;
      background: var(--accent-soft);
      color: var(--accent-ink);
      font-family: var(--display);
    }

    .cell-name b {
      font-weight: 600;
      display: block
    }

    .cell-name small {
      color: var(--faint);
      font-family: var(--mono);
      font-size: 11px
    }

    td .sub {
      color: var(--muted);
      font-size: 12px
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap
    }

    .pill::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: currentColor
    }

    .pill.ok {
      background: var(--ok-soft);
      color: var(--ok)
    }

    .pill.warn {
      background: var(--warn-soft);
      color: var(--warn)
    }

    .pill.crit {
      background: var(--crit-soft);
      color: var(--crit)
    }

    .pill.info {
      background: var(--info-soft);
      color: var(--info)
    }

    .pill.muted {
      background: var(--ground);
      color: var(--muted)
    }

    .pill.plain {
      background: var(--ground);
      color: var(--muted);
      font-weight: 500
    }

    .pill.plain::before {
      display: none
    }

    .row-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end
    }

    .icon-btn {
      border: 1px solid var(--line-strong);
      background: var(--surface);
      border-radius: 7px;
      padding: 5px 8px;
      color: var(--muted);
      line-height: 1;
      display: inline-flex
    }

    .icon-btn:hover {
      color: var(--ink);
      border-color: var(--line-strong);
      background: var(--surface-2)
    }

    .empty {
      padding: 56px 20px;
      text-align: center;
      color: var(--muted)
    }

    .empty svg {
      opacity: .4;
      margin-bottom: 10px
    }

    .empty b {
      display: block;
      color: var(--ink);
      font-family: var(--display);
      font-size: 16px;
      margin-bottom: 4px
    }

    /* ---------- drawer ---------- */
    .scrim {
      position: fixed;
      inset: 0;
      background: rgba(20, 26, 23, .42);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
      z-index: 40
    }

    .scrim.open {
      opacity: 1;
      pointer-events: auto
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: min(520px, 100vw);
      background: var(--surface);
      border-left: 1px solid var(--line);
      box-shadow: var(--shadow);
      transform: translateX(100%);
      transition: transform .22s cubic-bezier(.4, 0, .2, 1);
      z-index: 50;
      display: flex;
      flex-direction: column;
    }

    .drawer.open {
      transform: translateX(0)
    }

    .drawer-head {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px
    }

    .drawer-head h2 {
      font-size: 19px
    }

    .drawer-head .eyebrow {
      margin-bottom: 3px
    }

    .drawer-body {
      padding: 20px 24px 28px;
      overflow-y: auto;
      flex: 1
    }

    .drawer-foot {
      padding: 14px 24px;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      background: var(--surface-2)
    }

    .x {
      border: 0;
      background: none;
      color: var(--muted);
      padding: 4px;
      border-radius: 6px;
      line-height: 1
    }

    .x:hover {
      background: var(--ground);
      color: var(--ink)
    }

    .field {
      margin-bottom: 14px
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 5px;
      color: var(--muted)
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface-2);
    }

    .field textarea {
      resize: vertical;
      min-height: 64px
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .field .hint {
      font-size: 11px;
      color: var(--faint);
      margin-top: 4px
    }

    fieldset {
      border: 0;
      padding: 0;
      margin: 0 0 6px
    }

    fieldset legend {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .09em;
      color: var(--faint);
      font-weight: 600;
      margin-bottom: 10px;
      padding-top: 8px
    }

    /* ficha (detail) */
    .ficha-top {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 18px
    }

    .ficha-top .avatar {
      width: 52px;
      height: 52px;
      font-size: 19px;
      border-radius: 12px
    }

    .ficha-top b {
      font-family: var(--display);
      font-weight: 700;
      font-size: 19px;
      display: block
    }

    .ficha-top small {
      color: var(--muted);
      font-family: var(--mono)
    }

    .dl {

  <!-- ==========================================================
       PIEL PROGRAMASGT — capa aditiva sobre el panel de RRHH

       No reescribe el CSS original: lo redefine desde los tokens y
       le anade el lenguaje visual del sitio (malla de circuito,
       vidrio de instrumento, lluvia de datos, glow azul).

       Para revertir: borra este bloque, el script pgt-piel-js y la
       cabecera .pgt-top, y devuelve el enlace de Google Fonts a
       Bricolage Grotesque + IBM Plex.
       ========================================================== -->
  <style id="pgt-piel">
    /* ---------- 1. Tokens ----------
       La paleta verde original se cambia por el azul de ingenieria de
       la marca. Los roles semanticos (ok / warn / crit / info) se
       mantienen: un estado no puede depender del color de marca. */
    :root {
      color-scheme: dark light;

      --ground: #EEF2F7;
      --surface: #FFFFFF;
      --surface-2: #F2F6FB;
      --ink: #071120;
      --muted: #42536B;
      --faint: #5E6E82;
      --line: #CBD6E4;
      /* Un borde DECORATIVO puede ser tenue; el de un control necesita
         3:1 (WCAG 1.4.11). Por eso line-strong es mas oscuro que el
         original: medido, #CFD7D0 daba 1.5:1 sobre blanco. */
      --line-strong: #6F849F;
      --accent: #0B63C4;
      --accent-ink: #0A55A8;
      --accent-soft: rgba(11, 99, 196, .10);
      --on-accent: #FFFFFF;
      --ok: #0E7A55;
      --ok-soft: #DDF0E7;
      --warn: #96600B;
      --warn-soft: #F7EBD6;
      --crit: #A93A3A;
      --crit-soft: #F6E1DF;
      --info: #2F6488;
      --info-soft: #E2EDF4;
      --shadow: 0 1px 2px rgba(7, 17, 32, .06), 0 14px 34px -14px rgba(7, 17, 32, .20);
      --radius: 12px;

      --sans: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      --display: "Plus Jakarta Sans", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

      --circuito: rgba(11, 99, 196, .10);
      --vid-solidez: 86%;
      --vid-blur: 14px;
      --vid-borde: rgba(11, 99, 196, .20);
      --vid-luz: rgba(255, 255, 255, .85);
      --vid-brillo: rgba(11, 99, 196, .20);
      --vid-alta: 0 2px 4px rgba(7, 17, 32, .07), 0 28px 54px -26px rgba(11, 99, 196, .40);
      --curva: cubic-bezier(.2, .8, .2, 1);
      --pgt-h: 76px;
    }

    /* El tema oscuro llega por dos caminos: el boton (data-theme) y la
       preferencia del sistema. Los dos tienen que decir lo mismo. */
    :root[data-theme="dark"] {
      --ground: #04080F;
      --surface: #0A121F;
      --surface-2: #121C2C;
      --ink: #E7EEF8;
      --muted: #9FB0C6;
      /* Sobre vidrio al 62% el gris sutil perdia contraste: se sube. */
      --faint: #8CA0BA;
      --line: #1D2A3D;
      --line-strong: #50688C;
      --accent: #2A9BF5;
      --accent-ink: #5CB6FF;
      --accent-soft: rgba(42, 155, 245, .16);
      --on-accent: #03070E;
      --ok: #37C08C;
      --ok-soft: #0F2E24;
      --warn: #D69B4E;
      --warn-soft: #36291A;
      --crit: #E08079;
      --crit-soft: #38211F;
      --info: #7FB0CC;
      --info-soft: #14293A;
      --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 18px 40px -20px rgba(0, 0, 0, .75);
      --circuito: rgba(90, 175, 255, .13);
      --vid-solidez: 62%;
      --vid-blur: 18px;
      --vid-borde: rgba(140, 195, 255, .16);
      --vid-luz: rgba(180, 220, 255, .42);
      --vid-brillo: rgba(79, 163, 255, .28);
      --vid-alta:
        0 2px 6px rgba(0, 0, 0, .6),
        0 36px 66px -28px rgba(11, 99, 196, .55),
        0 0 0 1px rgba(79, 163, 255, .20);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --ground: #04080F;
        --surface: #0A121F;
        --surface-2: #121C2C;
        --ink: #E7EEF8;
        --muted: #9FB0C6;
        --faint: #8CA0BA;
        --line: #1D2A3D;
        --line-strong: #50688C;
        --accent: #2A9BF5;
        --accent-ink: #5CB6FF;
        --accent-soft: rgba(42, 155, 245, .16);
        --on-accent: #03070E;
        --ok: #37C08C;
        --ok-soft: #0F2E24;
        --warn: #D69B4E;
        --warn-soft: #36291A;
        --crit: #E08079;
        --crit-soft: #38211F;
        --info: #7FB0CC;
        --info-soft: #14293A;
        --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 18px 40px -20px rgba(0, 0, 0, .75);
        --circuito: rgba(90, 175, 255, .13);
        --vid-solidez: 62%;
        --vid-blur: 18px;
        --vid-borde: rgba(140, 195, 255, .16);
        --vid-luz: rgba(180, 220, 255, .42);
        --vid-brillo: rgba(79, 163, 255, .28);
        --vid-alta:
          0 2px 6px rgba(0, 0, 0, .6),
          0 36px 66px -28px rgba(11, 99, 196, .55),
          0 0 0 1px rgba(79, 163, 255, .20);
      }
    }

    /* ---------- 2. El fondo ----------
       Malla de circuito fija + tres focos azules muy difusos. Van en
       pseudo-elementos del body: cero nodos extra, cero JS. */
    body {
      font-family: var(--sans);
      font-size: 14.5px;
      letter-spacing: -.005em;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(to right, var(--circuito) 1px, transparent 1px),
        linear-gradient(to bottom, var(--circuito) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(ellipse 120% 80% at 50% 0%, #000 15%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse 120% 80% at 50% 0%, #000 15%, transparent 80%);
    }

    /* Tres focos azules muy difusos sobre el negro. Fijos: el contenido
       pasa por encima de la luz en vez de arrastrarla. */
    :root[data-theme="dark"] body {
      background-image:
        radial-gradient(1100px 620px at 8% -10%, rgba(11, 99, 196, .20), transparent 60%),
        radial-gradient(900px 560px at 95% 4%, rgba(79, 163, 255, .12), transparent 58%),
        radial-gradient(1000px 640px at 55% 110%, rgba(11, 99, 196, .10), transparent 60%);
      background-attachment: fixed;
    }

    /* En "automático" los focos solo aparecen si el sistema está en
       oscuro: sobre el fondo claro dejaban una neblina azul. */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]):not([data-theme="dark"]) body {
        background-image:
          radial-gradient(1100px 620px at 8% -10%, rgba(11, 99, 196, .20), transparent 60%),
          radial-gradient(900px 560px at 95% 4%, rgba(79, 163, 255, .12), transparent 58%),
          radial-gradient(1000px 640px at 55% 110%, rgba(11, 99, 196, .10), transparent 60%);
        background-attachment: fixed;
      }
    }

    .app {
      position: relative;
      z-index: 1;
    }

    h1,
    h2,
    h3 {
      letter-spacing: -.028em;
    }

    .num,
    .mono,
    .tile .v,
    .cell-name small,
    .mi-date {
      font-family: var(--mono);
      font-feature-settings: "tnum" 1;
    }

    /* ---------- 3. Barra de marca ----------
       Sticky, con la lluvia de datos detras. La mascara la apaga hacia
       abajo y hacia la derecha para que el texto no compita con ella. */
    .pgt-top {
      position: sticky;
      top: 0;
      z-index: 30;
      height: var(--pgt-h);
      display: flex;
      align-items: center;
      overflow: hidden;
      isolation: isolate;
      background: color-mix(in srgb, var(--surface) 82%, transparent);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      backdrop-filter: blur(16px) saturate(140%);
      border-bottom: 1px solid var(--vid-borde);
    }

    .pgt-top::after {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: .5;
      pointer-events: none;
    }

    .pgt-lluvia {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: .38;
      mask-image: linear-gradient(90deg, #000 0%, #000 34%, transparent 72%);
      -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 34%, transparent 72%);
    }

    :root[data-theme="dark"] .pgt-lluvia {
      opacity: .55;
    }

    .pgt-top-in {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 20px 0 14px;
    }

    .pgt-marca {
      display: flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
      color: var(--ink);
      padding: 6px 8px;
      border-radius: 10px;
      transition: background .2s var(--curva);
    }

    .pgt-marca:hover {
      background: var(--accent-soft);
    }

    .pgt-logo {
      width: 38px;
      height: 38px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: var(--on-accent);
      background: linear-gradient(145deg, var(--accent), var(--accent-ink));
      box-shadow: 0 0 0 1px var(--vid-borde), 0 8px 18px -8px rgba(11, 99, 196, .7);
    }

    .pgt-logo svg {
      width: 21px;
      height: 21px;
    }

    .pgt-marca-txt b {
      display: block;
      font-family: var(--display);
      font-weight: 800;
      font-size: 15.5px;
      line-height: 1.15;
      letter-spacing: -.02em;
    }

    .pgt-marca-txt small {
      display: block;
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--faint);
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .pgt-top-acc {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pgt-vivo {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .pgt-vivo i {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--ok);
      box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent);
      animation: pgt-latido 2.4s var(--curva) infinite;
    }

    @keyframes pgt-latido {

      0%,
      100% {
        box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 55%, transparent);
      }

      50% {
        box-shadow: 0 0 0 5px transparent;
      }
    }

    .pgt-btn {
      display: inline-flex;
      align-items: center;
      /* El minimo tactil es 44x44; aqui 42 mas el aire de la barra. */
      min-height: 42px;
      padding: 0 16px;
      border-radius: 9px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: var(--on-accent);
      font-weight: 600;
      font-size: 13px;
      text-decoration: none;
      white-space: nowrap;
      transition: box-shadow .26s var(--curva), transform .18s var(--curva), filter .26s ease;
    }

    .pgt-btn:hover,
    .pgt-btn:focus-visible {
      transform: translateY(-1px);
      filter: brightness(1.07);
      box-shadow:
        0 0 0 1px color-mix(in srgb, var(--accent) 60%, transparent),
        0 0 18px rgba(11, 99, 196, .5),
        0 0 40px rgba(11, 99, 196, .26);
    }

    .pgt-btn.ghost {
      background: none;
      color: var(--muted);
      border-color: var(--line-strong);
    }

    .pgt-btn.ghost:hover,
    .pgt-btn.ghost:focus-visible {
      color: var(--ink);
      border-color: var(--accent);
      box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 22%, transparent);
    }

    /* El logotipo cae letra por letra, como en el sitio. El texto real
       queda en una copia oculta para el lector de pantalla. */
    .letra {
      display: inline-block;
      opacity: 0;
      transform: translateY(-.9em);
      animation: pgt-caer .46s cubic-bezier(.22, .9, .3, 1) forwards;
      animation-delay: var(--d, 0ms);
    }

    @keyframes pgt-caer {
      0% {
        opacity: 0;
        transform: translateY(-.9em);
        color: var(--accent);
      }

      55% {
        opacity: 1;
        color: var(--accent);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
        color: inherit;
      }
    }

    .pgt-marca:hover .letra,
    .pgt-marca:focus-within .letra {
      animation: pgt-recaer .5s cubic-bezier(.22, .9, .3, 1) both;
      animation-delay: var(--dh, 0ms);
    }

    @keyframes pgt-recaer {
      0% {
        transform: translateY(0);
        opacity: 1;
      }

      30% {
        transform: translateY(-.5em);
        opacity: .25;
        color: var(--accent);
      }

      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .pgt-sr {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    /* ---------- 4. Vidrio de instrumento ----------
       Solidez alta a proposito: debajo hay texto que debe seguir
       legible. Un panel al 15% es bonito en una captura y falla AA. */
    .side,
    .tile,
    .card,
    .table-wrap,
    .drawer,
    .banner {
      background: color-mix(in srgb, var(--surface) var(--vid-solidez), transparent);
      -webkit-backdrop-filter: blur(var(--vid-blur)) saturate(135%);
      backdrop-filter: blur(var(--vid-blur)) saturate(135%);
      border: 1px solid var(--vid-borde);
      box-shadow: var(--shadow);
    }

    .side {
      top: var(--pgt-h);
      height: calc(100vh - var(--pgt-h));
      border-width: 0 1px 0 0;
      box-shadow: none;
      padding: 18px 12px;
    }

    /* Luz especular en el canto superior: una linea de 1px mas clara en
       el centro. Dice "hay volumen" sin neblina. */
    .tile,
    .card,
    .table-wrap {
      position: relative;
      isolation: isolate;
    }

    .tile::before,
    .card::before,
    .table-wrap::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 1px;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, var(--vid-luz) 42%, var(--vid-luz) 58%, transparent);
      opacity: .9;
      pointer-events: none;
      z-index: 2;
    }

    /* El :not() no es cosmetico: el resplandor es hijo de la tarjeta y
       sin excluirlo heredaria position:relative y se pintaria ENCIMA
       del contenido en vez de debajo. */
    .tile>*:not(.tilt-brillo),
    .card>*:not(.tilt-brillo) {
      position: relative;
      z-index: 3;
    }

    /* Sin backdrop-filter (Firefox antiguo, aceleracion desactivada):
       superficie solida en vez de un panel semitransparente ilegible. */
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {

      .side,
      .tile,
      .card,
      .table-wrap,
      .drawer,
      .pgt-top,
      .banner {
        background: var(--surface);
      }
    }

    /* ---------- 5. Inclinacion 3D y resplandor que sigue al cursor ----------
       Las variables las escribe el JS. Sin JS, o con puntero tactil,
       los valores por defecto dejan la tarjeta plana y sin brillo. */
    .js-tilt {
      transform-style: preserve-3d;
      will-change: transform;
      transition: box-shadow .28s var(--curva), border-color .28s ease;
    }

    .tilt-brillo {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity .28s ease;
      background: radial-gradient(220px circle at var(--mx, 50%) var(--my, 50%),
          var(--vid-brillo), transparent 62%);
    }

    .js-tilt:hover .tilt-brillo,
    .js-tilt:focus-within .tilt-brillo {
      opacity: 1;
    }

    .js-tilt:hover,
    .js-tilt:focus-within {
      box-shadow: var(--vid-alta);
      border-color: color-mix(in srgb, var(--accent) 45%, var(--vid-borde));
    }

    /* ---------- 6. Baldosas ---------- */
    .tiles {
      gap: 16px;
      margin-bottom: 20px;
    }

    .tile {
      border-radius: var(--radius);
      padding: 17px 18px 15px;
    }

    .tile .k {
      font-family: var(--mono);
      letter-spacing: .08em;
      font-size: 10.5px;
    }

    .tile .v {
      font-size: 31px;
      font-weight: 500;
      letter-spacing: -.03em;
    }

    .tile.accent {
      background:
        linear-gradient(145deg, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%),
        color-mix(in srgb, var(--surface) var(--vid-solidez), transparent);
      border-color: color-mix(in srgb, var(--accent) 38%, transparent);
    }

    .tile.accent .v,
    .tile.accent .k {
      color: var(--accent-ink);
    }

    /* El anillo: la misma cifra, en forma. */
    .anillo {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      z-index: 3;
    }

    .anillo svg {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
    }

    .anillo circle {
      fill: none;
      stroke-width: 3.5;
      stroke-linecap: round;
    }

    .anillo-bg {
      stroke: var(--line);
    }

    .anillo-v {
      stroke: var(--accent);
      /* 2 * PI * 18 = 113.1 */
      stroke-dasharray: 113.1;
      stroke-dashoffset: 113.1;
      animation: pgt-anillo .9s var(--curva) .15s forwards;
    }

    @keyframes pgt-anillo {
      to {
        stroke-dashoffset: calc(113.1 - (113.1 * var(--pct) / 100));
      }
    }

    .anillo b {
      font-family: var(--mono);
      font-size: 10.5px;
      font-weight: 500;
      color: var(--muted);
    }

    /* ---------- 7. Asistencia de la semana ---------- */
    .semana {
      margin-top: 16px;
    }

    .semana-chart {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      align-items: end;
      padding-top: 4px;
    }

    .semana-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .semana-n {
      font-size: 11.5px;
      color: var(--muted);
      font-weight: 500;
    }

    .semana-track {
      width: 100%;
      height: 96px;
      display: flex;
      align-items: flex-end;
      background: linear-gradient(to top, var(--line-soft, transparent), transparent);
      border-radius: 8px;
      position: relative;
    }

    .semana-track::after {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 1px;
      background: var(--line);
    }

    .semana-fill {
      width: 100%;
      min-height: 3px;
      border-radius: 7px 7px 0 0;
      background: linear-gradient(to top, color-mix(in srgb, var(--accent) 45%, transparent), var(--accent));
      height: var(--h);
      animation: pgt-crecer .6s var(--curva) both;
      animation-delay: var(--r, 0ms);
    }

    .semana-fill.hoy {
      background: linear-gradient(to top, var(--accent), var(--accent-ink));
      box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 45%, transparent);
    }

    @keyframes pgt-crecer {
      from {
        height: 0;
      }

      to {
        height: var(--h);
      }
    }

    .semana-dia {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--faint);
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .semana-pie {
      margin: 14px 0 0;
      font-size: 11.5px;
      color: var(--faint);
    }

    /* ---------- 8. Barras del panel ---------- */
    .bar-track {
      background: color-mix(in srgb, var(--ink) 8%, transparent);
      height: 9px;
    }

    .bar-fill {
      background: linear-gradient(90deg, var(--accent-ink), var(--accent));
      animation: pgt-barra .7s var(--curva) both;
    }

    @keyframes pgt-barra {
      from {
        transform: scaleX(0);
      }

      to {
        transform: scaleX(1);
      }
    }

    .bar-fill {
      transform-origin: left center;
    }

    /* ---------- 9. Navegacion lateral ---------- */
    .brand .mark {
      background: linear-gradient(145deg, var(--accent), var(--accent-ink));
      box-shadow: 0 6px 16px -8px rgba(11, 99, 196, .8);
      font-family: var(--mono);
      font-weight: 500;
    }

    .nav button {
      position: relative;
      min-height: 40px;
      transition: background .18s var(--curva), color .18s var(--curva);
    }

    .nav button.active {
      background: var(--accent-soft);
      color: var(--accent-ink);
    }

    /* Marca de posicion: el estado activo no queda solo en el color. */
    .nav button.active::before {
      content: "";
      position: absolute;
      left: -12px;
      top: 8px;
      bottom: 8px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .nav .count {
      font-family: var(--mono);
      background: color-mix(in srgb, var(--ink) 8%, transparent);
    }

    .themebtn {
      min-height: 36px;
      transition: border-color .18s var(--curva), color .18s var(--curva), box-shadow .22s var(--curva);
    }

    .themebtn:hover {
      border-color: var(--accent);
      box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 18%, transparent);
    }

    /* ---------- 10. Botones, tabla, formularios ---------- */
    .btn {
      min-height: 38px;
      border-radius: 9px;
      transition: box-shadow .24s var(--curva), transform .16s var(--curva), filter .24s ease, background .2s ease;
    }

    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-1px);
      box-shadow:
        0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent),
        0 0 16px rgba(11, 99, 196, .45);
    }

    .btn.ghost:hover {
      border-color: var(--accent);
      box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 20%, transparent);
    }

    .btn.sm {
      min-height: 32px;
    }

    .icon-btn {
      min-width: 32px;
      min-height: 30px;
      justify-content: center;
      transition: color .18s var(--curva), border-color .18s var(--curva), background .18s var(--curva);
    }

    .icon-btn:hover {
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    thead th {
      background: color-mix(in srgb, var(--surface-2) 80%, transparent);
      font-family: var(--mono);
      letter-spacing: .06em;
    }

    tbody tr.clickable:hover {
      background: var(--accent-soft);
    }

    .avatar {
      background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 22%, transparent), var(--accent-soft));
      color: var(--accent-ink);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 24%, transparent);
    }

    .search input,
    .filters select,
    .att-toolbar input[type=date],
    .field input,
    .field select,
    .field textarea,
    .seg,
    .chip {
      border-color: var(--line-strong);
      transition: border-color .18s var(--curva), box-shadow .18s var(--curva);
    }

    .search input:focus,
    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
      outline: none;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .chip {
      min-height: 30px;
      display: inline-flex;
      align-items: center;
    }

    .pill {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 11px;
    }

    .banner {
      background: color-mix(in srgb, var(--warn-soft) 80%, transparent);
      border-color: color-mix(in srgb, var(--warn) 32%, transparent);
    }

    /* ---------- 11. Cajon lateral ---------- */
    .drawer {
      border-left: 1px solid var(--vid-borde);
      box-shadow: -30px 0 70px -30px rgba(0, 0, 0, .6);
    }

    .scrim {
      background: rgba(3, 8, 16, .55);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
    }

    .drawer-foot {
      background: color-mix(in srgb, var(--surface-2) 70%, transparent);
    }

    .toast {
      background: color-mix(in srgb, var(--ink) 94%, transparent);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 34px -12px rgba(0, 0, 0, .7);
    }

    /* ---------- 12. Aparicion escalonada ----------
       Solo al cambiar de vista. Reanimar en cada clic seria ruido. */
    .pgt-entra {
      animation: pgt-subir .42s var(--curva) backwards;
      animation-delay: var(--e, 0ms);
    }

    @keyframes pgt-subir {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .main {
      max-width: 1280px;
      padding: 24px 28px 64px;
    }

    .page-head h1 {
      font-size: 27px;
      font-weight: 800;
    }

    /* ---------- 13. Pantallas pequenas ---------- */
    @media (max-width: 900px) {
      :root {
        --pgt-h: auto;
      }

      .pgt-top {
        height: auto;
        position: static;
      }

      .pgt-top-in {
        flex-wrap: wrap;
        padding: 10px 14px;
        gap: 10px;
      }

      .pgt-top-acc {
        width: 100%;
        margin-left: 0;
      }

      .pgt-vivo {
        margin-right: auto;
      }

      .pgt-btn {
        flex: 1;
        justify-content: center;
      }

      .side {
        top: auto;
        height: auto;
        border-width: 0 0 1px 0;
      }

      .semana-track {
        height: 72px;
      }

      .main {
        padding: 18px 14px 56px;
      }
    }

    @media (max-width: 560px) {
      .tiles {
        grid-template-columns: 1fr;
      }

      .anillo {
        top: 12px;
        right: 12px;
      }

      .pgt-marca-txt small {
        display: none;
      }
    }

    /* ---------- 14. Menos movimiento ----------
       Todo lo que se repite en bucle se apaga; lo que solo entra, se
       queda en su estado final. */
    @media (prefers-reduced-motion: reduce) {

      .pgt-lluvia,
      .tilt-brillo {
        display: none !important;
      }

      .letra,
      .pgt-marca:hover .letra,
      .pgt-marca:focus-within .letra {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }

      .pgt-vivo i {
        animation: none !important;
      }

      .semana-fill,
      .bar-fill,
      .anillo-v,
      .pgt-entra {
        animation: none !important;
      }

      .anillo-v {
        stroke-dashoffset: calc(113.1 - (113.1 * var(--pct) / 100));
      }

      .js-tilt {
        transform: none !important;
      }

      .btn:hover,
      .pgt-btn:hover {
        transform: none;
      }
    }

    @media (hover: none) {
      .tilt-brillo {
        display: none;
      }
    }
  </style>

</head>

<body>

  <!-- ==========================================================
       BARRA DE MARCA — esto es un producto de ProgramasGT, no una
       demo huerfana. Lleva la lluvia de datos detras y las dos
       acciones que convierten: ver el catalogo y cotizar.
       ========================================================== -->
  <header class="pgt-top">
    <canvas class="pgt-lluvia" aria-hidden="true"></canvas>
    <div class="pgt-top-in">
      <a class="pgt-marca" href="https://programasgt.art/" target="_blank" rel="noopener">
        <span class="pgt-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M4 7h5M4 12h3M4 17h5" />
            <rect x="9" y="4" width="11" height="16" rx="2.5" />
            <path d="M12.5 9.5h4M12.5 13h4M12.5 16.5h2" />
          </svg>
        </span>
        <span class="pgt-marca-txt">
          <b data-letras>ProgramasGT</b>

        </span>

          versión</a>
      </div>

  </header>

  <div class="app">
    <aside class="side">
      <div class="brand">
        <div class="mark" id="brandMark">RH</div>
        <div>
          <b id="brandName">Control de Personal</b>
          <span id="brandBiz">Recursos Humanos</span>
        </div>
      </div>
      <nav class="nav" id="nav">
        <button data-view="panel" class="active"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <rect x="3" y="3" width="7" height="9" />
            <rect x="14" y="3" width="7" height="5" />
            <rect x="14" y="12" width="7" height="9" />
            <rect x="3" y="16" width="7" height="5" />
          </svg>Panel</button>
        <button data-view="empleados"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>Empleados<span class="count" data-count="empleados">0</span></button>
        <button data-view="asistencia"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4" />
          </svg>Asistencia</button>
        <button data-view="ausencias"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <path d="M8 2v4M16 2v4M3 10h18" />
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <path d="M12 14v4M10 16h4" />
          </svg>Ausencias<span class="count" data-count="ausencias">0</span></button>
        <button data-view="registros"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8" />
          </svg>Registros<span class="count" data-count="registros">0</span></button>
      </nav>
      <div class="foot">
        <div class="foot-row">
          <button class="themebtn" id="themeBtn" aria-label="Cambiar tema">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
            <span id="themeLbl">Tema</span>
          </button>
        </div>
        <div class="foot-row">
          <button class="themebtn" id="exportBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" />
            </svg>
            Exportar
          </button>
          <button class="themebtn" id="importBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 9l5-5 5 5M12 4v12" />
            </svg>
            Importar
          </button>
          <input type="file" id="importFile" accept="application/json,.json" hidden>

        <small id="storageNote">Los datos se guardan solo en este navegador. Usa <b>Exportar</b> para
          respaldarlos.</small>

    <main class="main" id="main"></main>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    "use strict";

    /* ============ constantes ============ */
    const COLS = ["empleados", "asistencia", "ausencias", "registros"];
    const DEPARTAMENTOS = ["Administración", "Ventas", "Operaciones", "Bodega", "Producción", "Contabilidad", "Atención al cliente", "Recursos Humanos"];
    const CONTRATOS = ["Indefinido", "Plazo fijo", "Por obra", "Aprendizaje", "Servicios profesionales"];
    const ESTADOS_EMP = ["Activo", "Suspendido", "Inactivo"];
    const ASIST_ESTADOS = ["presente", "ausente", "vacaciones", "permiso", "incapacidad", "asueto"];
    const AUS_TIPOS = ["Vacaciones", "Permiso con goce", "Permiso sin goce", "Incapacidad IGSS", "Suspensión", "Licencia por maternidad", "Otro"];
    const AUS_ESTADOS = ["Solicitada", "Aprobada", "Rechazada"];
    const REG_TIPOS = ["Contratación", "Aumento salarial", "Promoción", "Amonestación", "Felicitación", "Capacitación", "Cambio de puesto", "Nota general", "Finalización de contrato"];
    const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];

    /* ============ estado ============ */
    const state = { empleados: [], asistencia: [], ausencias: [], registros: [] };
    let sampleMode = false;
    let view = "panel";
    const filters = { empQ: "", empDep: "", empEstado: "", ausEstado: "", regTipo: "", regEmp: "", attDate: todayISO(), attView: "dia" };

    /* ============ utilidades ============ */
    // Fecha LOCAL. Con toISOString, en Guatemala (UTC-6) a partir de las
    // 18:00 la asistencia se guardaba con la fecha del dia siguiente.
    function isoLocal(d) {
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }
    function todayISO() { return isoLocal(new Date()); }
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
    function $(sel, root) { return (root || document).querySelector(sel); }
    function el(tag, attrs, kids) {
      const n = document.createElement(tag);
      if (attrs) for (const k in attrs) {
        if (k === "class") n.className = attrs[k];
        else if (k === "html") n.innerHTML = attrs[k];
        else if (k === "text") n.textContent = attrs[k];
        else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
        else if (attrs[k] != null) n.setAttribute(k, attrs[k]);
      }
      (kids || []).forEach(c => { if (c == null) return; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
      return n;
    }
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
    function money(n) {
      const v = Number(n) || 0;
      return "Q " + v.toLocaleString("es-GT", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function initials(name) {
      const p = String(name || "").trim().split(/\s+/).filter(Boolean);
      const a = (p[0] || "")[0] || "";
      const b = (p[1] || "")[0] || "";
      return ((a + b) || "?").toUpperCase();
    }
    function fmtDate(iso) {
      if (!iso) return "—";
      const d = new Date(iso + "T00:00:00");
      if (isNaN(d)) return iso;
      return `${d.getDate()} ${MESES[d.getMonth()].slice(0, 3)} ${d.getFullYear()}`;
    }
    function yearsBetween(iso, to) {
      if (!iso) return 0;
      const a = new Date(iso + "T00:00:00"), b = to ? new Date(to + "T00:00:00") : new Date();
      let y = b.getFullYear() - a.getFullYear();
      const m = b.getMonth() - a.getMonth();
      if (m < 0 || (m === 0 && b.getDate() < a.getDate())) y--;
      return Math.max(0, y);
    }
    function monthsBetween(iso) {
      if (!iso) return 0;
      const a = new Date(iso + "T00:00:00"), b = new Date();
      return Math.max(0, (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()));
    }
    function empById(id) { return state.empleados.find(e => e.id === id); }
    function empName(id) { const e = empById(id); return e ? e.nombre : "(empleado eliminado)"; }
    function activos() { return state.empleados.filter(e => e.estado === "Activo"); }
    function toast(msg) {
      const t = $("#toast"); t.textContent = msg; t.classList.add("show");
      clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
    }

    /* ============ persistencia ============ */
    const LS_KEY = "rrhh_control_v1";
    function saveLocal() {
      try { localStorage.setItem(LS_KEY, JSON.stringify({ ...state, _sample: false })); } catch (e) { }
    }
    function loadLocal() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (!raw) return false;
        const d = JSON.parse(raw);
        COLS.forEach(c => { state[c] = Array.isArray(d[c]) ? d[c] : []; });

    function importData(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const d = JSON.parse(reader.result);

          clearSamplesIfNeeded();
          COLS.forEach(c => { state[c] = Array.isArray(d[c]) ? d[c] : []; });
          sampleMode = false;
          saveLocal(); render();
          toast("Datos importados correctamente.");

      };
      reader.readAsText(file);
    }

    /* El anillo repite en forma lo que la baldosa ya dice en numeros: el
       color nunca es el unico portador del dato (WCAG 1.4.1). */
    function anilloAsistencia(p, t) {
      const pct = t ? Math.round(p / t * 100) : 0;
      const w = el("div", { class: "anillo" });
      w.setAttribute("aria-hidden", "true");
      w.innerHTML =
        '<svg viewBox="0 0 44 44" width="44" height="44">' +
        '<circle class="anillo-bg" cx="22" cy="22" r="18"/>' +
        '<circle class="anillo-v" cx="22" cy="22" r="18" style="--pct:' + pct + '"/>' +
        '</svg><b>' + pct + '%</b>';
      return w;
    }

    const DIAS_CORTOS = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];

    /* Siete dias de asistencia. Es la vista que un gerente mira primero:
       dice si el equipo esta completo o si el lunes siempre falta gente. */
    function cardSemana() {
      const card = el("div", { class: "card semana" });
      const total = Math.max(1, activos().length);
      card.appendChild(el("h2", null, ["Asistencia de los últimos 7 días",
        el("span", { class: "tag", text: "presentes por día" })]));

      const dias = [];
      for (let i = 6; i >= 0; i--) {
        const f = addDays(-i);
        const recs = state.asistencia.filter(a => a.fecha === f);
        dias.push({ f, presentes: recs.filter(a => a.estado === "presente").length, marcados: recs.length });
      }

      const chart = el("div", { class: "semana-chart" });
      dias.forEach((d, i) => {
        const pct = Math.min(100, Math.round(d.presentes / total * 100));
        const dd = new Date(d.f + "T00:00:00");
        const col = el("div", { class: "semana-col", title: fmtDate(d.f) + ": " + d.presentes + " de " + total + " presentes" }, [
          el("span", { class: "semana-n num", text: String(d.presentes) }),
          el("div", { class: "semana-track" }, [
            el("div", { class: "semana-fill" + (i === 6 ? " hoy" : ""), style: "--h:" + pct + "%;--r:" + (i * 45) + "ms" })
          ]),
          el("span", { class: "semana-dia", text: DIAS_CORTOS[dd.getDay()] })
        ]);
        chart.appendChild(col);
      });
      card.appendChild(chart);

      // Alternativa en texto: un lector de pantalla no ve las barras.
      const resumen = dias.map(d => DIAS_CORTOS[new Date(d.f + "T00:00:00").getDay()] + " " + d.presentes).join(", ");
      card.appendChild(el("p", { class: "sr", text: "Presentes por día: " + resumen + ". Total de empleados activos: " + total + "." }));
      card.appendChild(el("p", { class: "semana-pie", text: "Sobre " + total + " empleado(s) activo(s). Los días sin marcar cuentan como cero." }));
      return card;
    }

    function tile(k, v, s, accent) {
      return el("div", { class: "tile" + (accent ? " accent" : "") }, [
        el("div", { class: "k", text: k }), el("div", { class: "v", text: v }), el("div", { class: "s", text: s })
      ]);
    }
    function hoyLargo() {
      const d = new Date();
      return `Hoy es ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`;
    }
    function buildAlerts() {
      const out = [];
      const now = new Date(), mes = now.getMonth();
      // aniversarios laborales este mes -> nuevas vacaciones
      state.empleados.filter(e => e.estado === "Activo" && e.fechaIngreso).forEach(e => {
        const d = new Date(e.fechaIngreso + "T00:00:00");
        if (d.getMonth() === mes) {
          const anios = now.getFullYear() - d.getFullYear();
          if (anios >= 1) out.push({
            level: "info", title: `Aniversario laboral · ${e.nombre}`,
            detail: `Cumple ${anios} año(s) el ${d.getDate()} de ${MESES[mes]}. Le corresponden 15 días de vacaciones.`
          });
        }
      });
      // cumpleaños este mes
      state.empleados.filter(e => e.estado === "Activo" && e.fechaNacimiento).forEach(e => {
        const d = new Date(e.fechaNacimiento + "T00:00:00");
        if (d.getMonth() === mes) out.push({
          level: "info", title: `Cumpleaños · ${e.nombre}`,
          detail: `${d.getDate()} de ${MESES[mes]}.`
        });
      });
      // ausencias solicitadas
      state.ausencias.filter(a => a.estado === "Solicitada").forEach(a => {
        out.push({
          level: "warn", title: `Ausencia por aprobar · ${empName(a.empleadoId)}`,
          detail: `${a.tipo}, ${a.dias || "?"} día(s) desde el ${fmtDate(a.inicio)}.`
        });
      });
      // contratos a plazo fijo
      state.empleados.filter(e => e.estado === "Activo" && e.tipoContrato === "Plazo fijo").forEach(e => {
        out.push({
          level: "warn", title: `Contrato a plazo fijo · ${e.nombre}`,
          detail: `Revisa la fecha de vencimiento y si corresponde renovar o pasar a indefinido.`
        });
      });
      // datos incompletos
      const sinDpi = state.empleados.filter(e => e.estado === "Activo" && !e.dpi).length;
      if (sinDpi) out.push({
        level: "crit", title: `${sinDpi} empleado(s) sin DPI registrado`,
        detail: `Completa el Documento Personal de Identificación para el expediente.`
      });
      return out.slice(0, 12);
    }

    /* ============ REGISTROS ============ */

        tr.appendChild(el("td", null, [el("span", { class: "pill plain", text: r.tipo })]));
        tr.appendChild(el("td", null, [el("div", { class: "sub", text: r.descripcion, style: "color:var(--ink);max-width:420px" })]));

    /* ============ ASISTENCIA ============ */
    function renderAsistencia(main) {
      main.appendChild(pageHead("Asistencia diaria", "Marca la asistencia del personal activo por día"));
      const bar = el("div", { class: "att-toolbar" });
      const dateInp = el("input", { type: "date", value: filters.attDate, max: todayISO(), onchange: e => { filters.attDate = e.target.value || todayISO(); render(); } });
      bar.appendChild(el("label", { class: "eyebrow", text: "Fecha" }));
      bar.appendChild(dateInp);
      bar.appendChild(el("button", { class: "btn ghost sm", text: "Hoy", onclick: () => { filters.attDate = todayISO(); render(); } }));
      bar.appendChild(el("button", { class: "btn sm", text: "Marcar a todos presentes", onclick: () => markAllPresent() }));
      main.appendChild(bar);

      const act = activos();
      if (!act.length) {
        main.appendChild(emptyState(ICO_PEOPLE, "No hay empleados activos", "Registra empleados con estado Activo para marcar su asistencia."));
        return;
      }
      const dayRecs = {};
      state.asistencia.filter(a => a.fecha === filters.attDate).forEach(a => { dayRecs[a.empleadoId] = a; });
      const rows = act.slice().sort((a, b) => a.nombre.localeCompare(b.nombre, "es")).map(e => {
        const rec = dayRecs[e.id];
        const tr = el("tr");
        tr.appendChild(el("td", null, [el("div", { class: "cell-name" }, [avatar(e.nombre), el("div", null, [el("b", { text: e.nombre }), el("small", { text: e.puesto || "" })])])]));
        const cell = el("td");
        const chips = el("div", { class: "att-status-cell" });
        ASIST_ESTADOS.forEach(st => {
          const on = rec && rec.estado === st;
          chips.appendChild(el("button", {
            class: "chip" + (on ? " on-" + st : ""), text: st[0].toUpperCase() + st.slice(1),
            onclick: () => setAsistencia(e.id, on ? null : st)
          }));
        });
        cell.appendChild(chips);
        tr.appendChild(cell);
        // horario
        const hcell = el("td", { class: "num" });
        if (rec && rec.estado === "presente") {
          const t1 = el("input", {
            type: "time", value: rec.entrada || "", style: "padding:5px 7px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface-2);width:100px",
            onchange: ev => updateAsistencia(rec.id, { entrada: ev.target.value })
          });
          const t2 = el("input", {
            type: "time", value: rec.salida || "", style: "padding:5px 7px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface-2);width:100px;margin-left:6px",
            onchange: ev => updateAsistencia(rec.id, { salida: ev.target.value })
          });
          hcell.appendChild(t1); hcell.appendChild(t2);
        } else { hcell.appendChild(el("span", { class: "sub", text: "—" })); }
        tr.appendChild(hcell);
        return tr;
      });
      main.appendChild(tableWrap(["Empleado", "Estado del día", "Entrada / Salida"], rows));

      const dd = new Date(filters.attDate + "T00:00:00");
      const resumen = {};
      ASIST_ESTADOS.forEach(s => resumen[s] = 0);
      Object.values(dayRecs).forEach(r => { if (resumen[r.estado] != null) resumen[r.estado]++; });
      const sinMarcar = act.length - Object.keys(dayRecs).length;
      main.appendChild(el("p", {
        class: "sub", style: "margin-top:14px;color:var(--muted)",
        text: `${MESES[dd.getMonth()]} ${dd.getDate()}: ${resumen.presente} presentes · ${resumen.ausente} ausentes · ${resumen.vacaciones} vacaciones · ${resumen.permiso + resumen.incapacidad} permisos/incapacidad · ${sinMarcar} sin marcar`
      }));
    }

    /* ============ mutaciones ============ */
    function upsert(col, obj) {
      clearSamplesIfNeeded();
      const arr = state[col];
      const i = arr.findIndex(x => x.id === obj.id);
      if (i >= 0) arr[i] = obj; else arr.push(obj);
      persist(col, obj);
      saveLocal();
      render();
    }
    function deleteRow(col, id) {
      state[col] = state[col].filter(x => x.id !== id);
      persistDelete(col, id);
      saveLocal();
      render();
      toast("Eliminado.");
    }
    function deleteEmpleado(id) {
      state.empleados = state.empleados.filter(e => e.id !== id);
      ["asistencia", "ausencias", "registros"].forEach(col => {
        state[col].filter(x => x.empleadoId === id).forEach(x => persistDelete(col, x.id));
        state[col] = state[col].filter(x => x.empleadoId !== id);
      });
      persistDelete("empleados", id);
      saveLocal(); render(); closeDrawer();
      toast("Empleado eliminado.");
    }
    function setAusEstado(id, estado) {
      const a = state.ausencias.find(x => x.id === id); if (!a) return;
      a.estado = estado; persist("ausencias", a); saveLocal(); render();
      toast(estado === "Aprobada" ? "Ausencia aprobada." : "Ausencia rechazada.");
    }
    function setAsistencia(empId, estado) {
      clearSamplesIfNeeded();
      const rec = state.asistencia.find(a => a.empleadoId === empId && a.fecha === filters.attDate);
      if (estado == null) {
        if (rec) { deleteRow("asistencia", rec.id); }
        return;
      }
      if (rec) { rec.estado = estado; if (estado !== "presente") { rec.entrada = ""; rec.salida = ""; } persist("asistencia", rec); }
      else {
        const nrec = { id: uid(), empleadoId: empId, fecha: filters.attDate, estado, entrada: "", salida: "", nota: "" };
        state.asistencia.push(nrec); persist("asistencia", nrec);
      }
      saveLocal(); render();
    }
    function updateAsistencia(id, patch) {
      const rec = state.asistencia.find(a => a.id === id); if (!rec) return;
      Object.assign(rec, patch); persist("asistencia", rec); saveLocal();
    }
    function markAllPresent() {
      clearSamplesIfNeeded();
      activos().forEach(e => {
        let rec = state.asistencia.find(a => a.empleadoId === e.id && a.fecha === filters.attDate);
        if (!rec) { rec = { id: uid(), empleadoId: e.id, fecha: filters.attDate, estado: "presente", entrada: "", salida: "", nota: "" }; state.asistencia.push(rec); }
        else rec.estado = "presente";
        persist("asistencia", rec);
      });
      saveLocal(); render(); toast("Todos marcados como presentes.");
    }

    /* ============ drawer ============ */
    function openDrawer(title, eyebrow, bodyNode, footNode) {
      const d = $("#drawer");
      d.innerHTML = "";
      d.appendChild(el("div", { class: "drawer-head" }, [
        el("div", null, [el("div", { class: "eyebrow", text: eyebrow || "" }), el("h2", { id: "drawerTitle", text: title })]),
        el("button", { class: "x", "aria-label": "Cerrar", html: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>', onclick: closeDrawer })
      ]));
      d.appendChild(el("div", { class: "drawer-body" }, [bodyNode]));
      if (footNode) d.appendChild(el("div", { class: "drawer-foot" }, [footNode]));
      d.classList.add("open");
      $("#scrim").classList.add("open");
      document.body.style.overflow = "hidden";
    }
    function closeDrawer() {
      $("#drawer").classList.remove("open");
      $("#scrim").classList.remove("open");
      document.body.style.overflow = "";
    }
    function fieldText(label, name, value, opts) {
      opts = opts || {};
      const inp = el("input", { type: opts.type || "text", name, value: value == null ? "" : value, placeholder: opts.ph || "", required: opts.required ? "required" : null, step: opts.step || null, min: opts.min || null, max: opts.max || null });
      return el("div", { class: "field" }, [el("label", { text: label }), inp, opts.hint ? el("div", { class: "hint", text: opts.hint }) : null]);
    }
    function fieldSelect(label, name, value, options, opts) {
      opts = opts || {};
      const s = el("select", { name, required: opts.required ? "required" : null });
      if (opts.placeholder) s.appendChild(el("option", { value: "", text: opts.placeholder }));
      options.forEach(o => s.appendChild(el("option", { value: o, text: o, selected: o === value ? "selected" : null })));
      s.value = value != null ? value : "";
      return el("div", { class: "field" }, [el("label", { text: label }), s]);
    }
    function fieldArea(label, name, value, ph) {
      return el("div", { class: "field" }, [el("label", { text: label }), el("textarea", { name, placeholder: ph || "", text: value || "" })]);
    }
    function row2(a, b) { return el("div", { class: "field-row" }, [a, b]); }
    function formValues(form) {
      const o = {};
      new FormData(form).forEach((v, k) => { o[k] = typeof v === "string" ? v.trim() : v; });
      return o;
    }

    /* ---- formulario empleado ---- */

      const e = id ? empById(id) : null;
      const form = el("form", { id: "empForm", onsubmit: ev => { ev.preventDefault(); saveEmpForm(form, id); } });
      form.appendChild(el("fieldset", null, [el("legend", { text: "Datos personales" }),

      ),

      ),

      ),

      )
      ]));

        fieldText("Nombre", "emergenciaNombre", e && e.emergenciaNombre),

      )
      ]));
      form.appendChild(fieldArea("Notas", "notas", e && e.notas, "Información adicional del expediente"));

      const foot = el("div", null, [

      ]);
      foot.querySelector("button[type=submit]").addEventListener("click", ev => { ev.preventDefault(); saveEmpForm(form, id); });
      openDrawer(id ? "Editar empleado" : "Nuevo empleado", id ? "Expediente" : "Alta de personal", form, foot);
    }
    function saveEmpForm(form, id) {
      if (!form.reportValidity()) return;
      const v = formValues(form);
      if (!v.nombre) { toast("El nombre es obligatorio."); return; }
      const base = id ? { ...empById(id) } : { id: uid() };
      const obj = { ...base, ...v, salario: v.salario ? Number(v.salario) : 0 };
      upsert("empleados", obj);
      closeDrawer();
      toast(id ? "Empleado actualizado." : "Empleado registrado.");
    }

    /* ---- formulario ausencia ---- */
    function openAusForm(id) {
      const a = id ? state.ausencias.find(x => x.id === id) : null;
      if (!state.empleados.length) { toast("Primero registra al menos un empleado."); return; }
      const form = el("form", { id: "ausForm" });
      const empOpts = state.empleados.slice().sort((x, y) => x.nombre.localeCompare(y.nombre, "es"));
      const sEmp = el("select", { name: "empleadoId", required: "required" });
      sEmp.appendChild(el("option", { value: "", text: "Seleccionar empleado…" }));
      empOpts.forEach(e => sEmp.appendChild(el("option", { value: e.id, text: e.nombre, selected: a && a.empleadoId === e.id ? "selected" : null })));
      form.appendChild(el("div", { class: "field" }, [el("label", { text: "Empleado" }), sEmp]));
      form.appendChild(fieldSelect("Tipo", "tipo", a && a.tipo, AUS_TIPOS, { placeholder: "Seleccionar…", required: true }));
      form.appendChild(row2(
        fieldText("Desde", "inicio", (a && a.inicio) || todayISO(), { type: "date", required: true }),
        fieldText("Hasta", "fin", (a && a.fin) || todayISO(), { type: "date", required: true })
      ));
      form.appendChild(row2(
        fieldText("Días", "dias", a && a.dias, { type: "number", min: "0", step: "0.5", hint: "Días hábiles solicitados" }),
        fieldSelect("Estado", "estado", (a && a.estado) || "Solicitada", AUS_ESTADOS)
      ));
      form.appendChild(fieldArea("Motivo / observaciones", "motivo", a && a.motivo));
      // autocalcular días
      const di = form.querySelector('[name=inicio]'), df = form.querySelector('[name=fin]'), dd = form.querySelector('[name=dias]');
      function calc() {
        if (di.value && df.value && !dd.value) {
          const d1 = new Date(di.value), d2 = new Date(df.value);
          const n = Math.round((d2 - d1) / 86400000) + 1;
          if (n > 0) dd.value = n;
        }
      }
      di.addEventListener("change", calc); df.addEventListener("change", calc);

      const foot = el("div", null, [
        el("button", { type: "button", class: "btn ghost", text: "Cancelar", onclick: closeDrawer }),
        el("button", {
          type: "button", class: "btn", text: id ? "Guardar" : "Registrar", onclick: () => {
            if (!form.reportValidity()) return;
            const v = formValues(form);
            const base = id ? { ...state.ausencias.find(x => x.id === id) } : { id: uid() };
            upsert("ausencias", { ...base, ...v, dias: v.dias ? Number(v.dias) : null });
            closeDrawer(); toast(id ? "Ausencia actualizada." : "Ausencia registrada.");
          }
        })
      ]);
      openDrawer(id ? "Editar ausencia" : "Registrar ausencia", "Vacaciones y permisos", form, foot);
    }

      form.appendChild(el("div", { class: "field" }, [el("label", { text: "Empleado" }), sEmp]));
      form.appendChild(row2(
        fieldSelect("Tipo de registro", "tipo", r && r.tipo, REG_TIPOS, { placeholder: "Seleccionar…", required: true }),

      ));
      form.appendChild(fieldArea("Descripción", "descripcion", r && r.descripcion, "Detalle del hecho: montos, motivos, acuerdos…"));
      const foot = el("div", null, [
